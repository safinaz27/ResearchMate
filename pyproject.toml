[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmate"
version = "0.1.0"
description = "Agentic research assistant powered by advanced RAG (hybrid search, reranking, cited answers)."
requires-python = ">=3.11,<3.12"
# Lower bounds only; exact versions that were tested live in requirements.lock.
# torch is intentionally NOT listed: it must be installed from the PyTorch CPU index
# first (see docs/implementation/step_01_project_setup.md), otherwise pip would pull
# the much larger CUDA build as a transitive dependency of sentence-transformers.
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Storage
    "sqlalchemy>=2.0",
    "chromadb>=1.0",
    # Document parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # Retrieval / models (run locally on CPU)
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    # Agent workflow + LLM (Groq via its OpenAI-compatible API)
    "langgraph>=0.2",
    "openai>=1.40",
    # UI + HTTP client
    "streamlit>=1.38",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: loads real ML models or performs heavy I/O",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
